[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldguard"
version = "1.0.0"
description = "Risk-calibrated qualification of model residency in finite-capacity MaaS systems."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "simpy==4.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
figures = ["matplotlib>=3.10,<4"]

[project.scripts]
coldguard = "coldguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

